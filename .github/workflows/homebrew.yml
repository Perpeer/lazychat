# Moves the tap (Perpeer/homebrew-tap) to a v* tag pushed by hand, from
# ./release.sh. The release workflow handles the tags it makes itself (a
# tag pushed by a workflow starts no other one). It needs the
# HOMEBREW_TAP_TOKEN secret; without it the job says so and stops.
name: Homebrew

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: update the tap with ./release.sh --formula $v"
            exit 0
          fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/Perpeer/homebrew-tap.git" "$RUNNER_TEMP/tap"
          git -C "$RUNNER_TEMP/tap" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          packaging/homebrew/update-tap.sh "$v" "$RUNNER_TEMP/tap"
          git -C "$RUNNER_TEMP/tap" push origin HEAD
