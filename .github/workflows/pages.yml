# Publishes site/ to GitHub Pages on every push to main that changes it;
# the README's images in assets/ are copied beside the page, not kept twice.
# Pages must be set to "GitHub Actions" in the repository's settings.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the images beside the page
        run: mkdir -p site/assets && cp assets/icon-1024.png assets/demo.gif assets/lazy.svg site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
